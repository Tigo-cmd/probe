[workspace]
resolver = "2"
members = ["crates/hwprobe", "crates/hwprobe-cli", "crates/scanstore"]
# The desktop shell is its own workspace: building it needs a webview
# toolchain the core crates must not depend on.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
windows-sys = "0.59"

[profile.release]
# The binary runs on the machine under test, often old and slow: keep it small.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
