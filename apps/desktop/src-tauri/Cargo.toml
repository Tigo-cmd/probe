[package]
name = "probe-desktop"
description = "Desktop shell for hwprobe"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"

# Standalone workspace; see the exclude in the root Cargo.toml.
[workspace]

[lib]
name = "probe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hwprobe = { path = "../../../crates/hwprobe" }
scanstore = { path = "../../../crates/scanstore" }
elevate = { path = "../../../crates/elevate" }
syncclient = { path = "../../../crates/syncclient" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Camera and microphone for the hands-on test: WebKitGTK keeps media
# capture off unless the app turns it on and answers the permission request.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
