name: Publish site

# Publishes the landing page in apps/site to GitHub Pages. The site is
# static, so it is uploaded as it is, with no build step.

on:
  push:
    branches: [claude/jolly-rubin-5n5nal, claude/new-session-pk9lf7, main]
    paths: [apps/site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site
      - id: deployment
        uses: actions/deploy-pages@v4
