name: Publish site redirect

# The website now lives in probe-pc/probe-pc.github.io and is published at
# https://probe-pc.github.io. This keeps the old address,
# tigo-cmd.github.io/probe, working by sending every page there.

on:
  push:
    branches: [main]
    paths: [.github/pages-redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
